<!-- avaTOK standard site header.
     [WEB-HEADER-6 2026-08-26] This is now a FAITHFUL copy of the live site's
     header (web/src/components/SiteHeader.astro), not a lookalike: the same
     hand-drawn wordmark and marigold ornament PNGs, the same cream ground
     (#f7ead5), the same 18px/30px bar with a 30px gap, and nav + CTAs at 16px
     Anton uppercase with 0.05em tracking. The previous version reproduced only
     the menu ITEMS and kept the comp's own text wordmark, which is why the comp
     pages still looked different from avatok.ai.

     The two images are absolute https://avatok.ai/ URLs on purpose. Every comp
     is served with <base href="https://avatok-design.pages.dev/">, so a relative
     /avatok-logo.png would resolve against the preview origin and 404. Absolute
     URLs render correctly BOTH here and on the standalone preview.

     Keep this in step with SiteHeader.astro. If a menu item changes there,
     change it here — the whole point is that the comps stop diverging.

     The jhalar band above the bar is the one piece that travelled the other way:
     it was in the comps first and is now in SiteHeader.astro too. -->
<div><dc-import name="TruckBorder" kind="jhalar" hint-size="100%,30px" style="display:block;"></dc-import></div>
<div style="background:#f7ead5; color:#161614;">
  <div style="display:flex; align-items:center; gap:1.875rem; padding:18px 30px;">

      <a href="#" style="font-family:'Anton',sans-serif; font-size:1rem; letter-spacing:.05em; text-transform:uppercase; color:#161614; white-space:nowrap;">Live events</a>
