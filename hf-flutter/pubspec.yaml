name: hf_app
description: Native Android app (HF-NATIVE-*). Demo frontend since 2026-10-19 (HF-DEMO-UI-1) - screens only, dummy data. Brand values come from Specs/brand.json through lib/core/brand.dart.
publish_to: 'none'
# CI overrides both with --build-name / --build-number (versionCode = 2000 + run number).
version: 2.0.0+2000

environment:
  sdk: '>=3.9.0 <4.0.0'

# Twenty runtime packages, on purpose (spec section 5.1; the old comment said seventeen but eighteen
# were listed). The newest, lottie, was owner-approved on 2026-10-15 (HF-MOTION-1) for the mascot and
# celebration motion; everything else in the motion kit is plain Flutter. Left out: google_fonts (fonts
# are bundled), flutter_local_notifications (the channel is made in Kotlin), dio, intl, image_picker,
# in_app_update, any code generation. Upgrading a package is its own issue, with pubspec.lock
# regenerated in CI.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.0           # state (no code generation)
  go_router: ^16.0.0                 # routing + tab shell
  http: ^1.2.0                       # API client (no dio)
  flutter_secure_storage: ^9.2.2     # Clerk client token
  shared_preferences: ^2.3.0         # caches, 18+ ack, pending call id
  cached_network_image: ^3.4.0       # avatars and gallery
  image: ^4.2.0                      # [HF-MOD-2] JPEG-encode the cropped profile photo (stays under the 4 MB AI check limit)
  posthog_flutter: ^5.30.0           # analytics (EU project 139917)
  firebase_core: ^4.1.1              # push (HF-NATIVE-7)
  firebase_messaging: ^16.0.2        # push (HF-NATIVE-7)
  in_app_purchase: ^3.2.0            # Google Play Billing (HF-NATIVE-6)
  audioplayers: ^6.1.0               # host voice intro playback
  record: 6.2.1                      # voice intro recorder (exact: the version proven in the avaTOK CI)
  camera: ^0.11.0+2                  # selfie video for host KYC
  video_player: ^2.9.2               # [HF-INTRO-A1] preview of the just-recorded intro video (Redo / Use this video). NEW package: owner/coordinator to approve
  permission_handler: ^12.0.1        # permission status, openAppSettings
  url_launcher: ^6.3.0               # Custom Tabs, tel:, Play link
  app_links: ^6.3.2                  # App Links + custom scheme
  package_info_plus: ^9.0.1          # version for the update check
  lottie: ^3.3.1                     # mascot and celebration motion (HF-MOTION-1)
  webview_flutter: ^4.10.0           # [HF-WIRE-4] official YouTube / Instagram reel embeds (embeds only, HF-REEL-32)
  webview_flutter_android: ^4.3.0    # [HF-WIRE-4] lets the embed autoplay
  google_sign_in: ^6.3.0             # [HF-WIRE-14] "Sign in with YouTube": read-only channel scope proves she owns the channel (HF-REEL-33)
  qr_flutter: ^4.1.0                 # [HF-APP-SHARE-QR-1] QR for Share my page
  share_plus: ^10.1.4                # [HF-WIRE-9] system share sheet for a reel link (Share.share)
  flutter_cashfree_pg_sdk: 2.5.0+53  # [HF-WIRE-20] in-app checkout (web-checkout mode: card / netbanking / UPI, UPI apps return to the app). Owner-approved; exact pin.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/brand/
    - assets/images/bazaar/intro/
    - assets/images/bazaar/feed/
    - assets/images/bazaar/signup/
    - assets/images/bazaar/loading/
    - assets/images/bazaar/profile/
    - assets/images/bazaar/dashboard/
    - assets/images/bazaar/wallet/
    - assets/images/bazaar/topup/
    - assets/images/bazaar/payout/
    - assets/images/bazaar/bg/
    - assets/images/bazaar/me/
    - assets/images/bazaar/favourites/
    - assets/images/bazaar/booking/
    - assets/images/bazaar/influencer/
    - assets/channel/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Regular.ttf
          weight: 400
        - asset: assets/fonts/Comfortaa-Medium.ttf
          weight: 500
        - asset: assets/fonts/Comfortaa-Bold.ttf
          weight: 700
