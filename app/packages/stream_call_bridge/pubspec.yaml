name: stream_call_bridge
description: Staging-only native Stream audio bridge for AvaTOK.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: ai.avatok.streamcall
        pluginClass: StreamCallBridgePlugin
