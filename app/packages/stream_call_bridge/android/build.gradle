group 'ai.avatok.streamcall'
version '1.0'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def streamPilot = System.getenv('STREAM_CALL_SDK') == '1'

android {
    namespace 'ai.avatok.streamcall'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    // Both variants export the same Flutter plugin class. The ordinary build
    // sees only the stub and therefore cannot accidentally package Stream.
    sourceSets {
        main.java.srcDirs = [streamPilot ? 'src/pilot/kotlin' : 'src/stub/kotlin']
        main.manifest.srcFile(streamPilot ? 'src/pilot/AndroidManifest.xml' : 'src/stub/AndroidManifest.xml')
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    if (streamPilot) {
        // 1.9.2 targets the M125 org.webrtc API used by AvaTOK. Keep AvaTOK's
        // existing M125 binary because it also contains the playback callback
        // required by recording/translation; Stream's fork omits that callback.
        // The app-level configuration reinforces this exclusion for packaging.
        // Pin core directly. Stream's 1.9.2 BOM artifact is published as a JVM
        // library rather than a Gradle platform, so AGP 8.9 cannot consume it
        // through platform(...). The core 1.9.2 artifact itself is available
        // from Maven Central and preserves the required WebRTC ABI.
        implementation('io.getstream:stream-video-android-core:1.9.2') {
            exclude group: 'io.getstream', module: 'stream-webrtc-android'
        }
        implementation 'io.github.webrtc-sdk:android:125.6422.03'
        implementation 'io.getstream:stream-android-push-firebase:1.3.1'
        implementation 'androidx.security:security-crypto:1.1.0'
    }
}
