<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record your intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Comfortaa:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Comfortaa',sans-serif}
.n{font-family:'Nunito',sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1b1430;color:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 46% 30% at 50% 36%,#d9a77f 0 58%,transparent 60%),radial-gradient(ellipse 70% 40% at 50% 92%,#7b2d5c 0 60%,transparent 62%),linear-gradient(180deg,#3b2a58,#24193d)"></div>
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 16px">
    <button class="n" aria-label="Close" style="width:44px;height:44px;border-radius:50%;border:none;background:#00000066;color:#fff;font-size:22px;font-weight:900">×</button>
    <div class="n" style="background:#00000066;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:#ff3b3b"></span>REC 0:12</div>
    <button class="n" aria-label="Flip camera" style="width:44px;height:44px;border-radius:50%;border:none;background:#00000066;color:#fff;font-size:18px;font-weight:900">⟲</button>
  </div>
  <div style="position:relative;margin:4px 16px 0;background:#00000059;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.45;font-weight:600">
    <span class="n" style="font-weight:900;color:#fbd447">Hint · </span>"Namaste, I'm Priya. Call me about marriage, career or a hard phase."
  </div>
  <div style="flex:1"></div>
  <div style="position:relative;padding:0 24px 8px">
    <div style="height:8px;border-radius:99px;background:#ffffff33;position:relative;overflow:visible">
      <div style="width:60%;height:100%;border-radius:99px;background:#fbd447"></div>
      <div style="position:absolute;left:50%;top:-6px;width:3px;height:20px;background:#fff"></div>
    </div>
    <div class="n" style="display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-top:8px"><span>0 s</span><span>10 s min</span><span>20 s max</span></div>
  </div>
  <div style="position:relative;display:flex;align-items:center;justify-content:center;gap:34px;padding:14px 0 30px">
    <button class="n" style="width:64px;height:48px;border-radius:14px;border:2px solid #ffffff88;background:transparent;color:#fff;font-weight:800;font-size:14px">Redo</button>
    <button aria-label="Stop recording" style="width:86px;height:86px;border-radius:50%;border:6px solid #fff;background:#ff3b3b;display:flex;align-items:center;justify-content:center"><span style="width:28px;height:28px;border-radius:6px;background:#fff"></span></button>
    <button class="n" style="width:64px;height:48px;border-radius:14px;border:none;background:#fbd447;color:#30245f;font-weight:900;font-size:14px">Done</button>
  </div>
  <div class="n" style="position:relative;text-align:center;font-weight:700;font-size:14px;padding:0 24px 18px;color:#ffffffcc">Live recording only · keep your phone upright</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
