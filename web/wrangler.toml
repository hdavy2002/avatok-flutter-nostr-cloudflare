# Cloudflare Pages config for the avatok.ai public web client.
# Project: avatok-app (separate from the static marketing site on `avatok-web`).
# The @astrojs/cloudflare adapter serves every route through `_worker.js`, which
# auto-enables Astro sessions backed by a KV namespace bound as SESSION. The SSR
# renderer (react-dom/server) relies on the runtime's global `MessageChannel`, so
# we deliberately do NOT set `nodejs_compat` (that flag shadows the web global at
# publish time and breaks the React renderer). A recent compatibility_date keeps
# `MessageChannel` and other web APIs available.
name = "avatok-app"
compatibility_date = "2025-05-05"
pages_build_output_dir = "./dist"

# Astro sessions store (adapter default binding name). Namespace created in the
# avatok.ai Cloudflare account.
[[kv_namespaces]]
binding = "SESSION"
id = "831f68e696d443cb923f2d7afbd7e750"

# Cloudflare Email Service (Specs/PLAN-2026-09-11-EMAIL-CLOUDFLARE-PRIMARY-BREVO-
# FALLBACK.md §3.4). Pages Functions use the REST API (no send_email binding on
# Pages), so this var + a secret are all that's needed:
#   CF_ACCOUNT_ID       — public, safe to commit (matches calls/wrangler.toml).
#   CF_EMAIL_API_TOKEN  — Pages secret set in the Cloudflare dashboard (Pages
#                          project → Settings → Environment variables), token
#                          scoped to Account → Email Sending: Edit only. Not in
#                          this file or in secrets/deploy.sh (that script only
#                          drives the three Workers, not Pages).
# BREVO_API_KEY / BREVO_SENDER_* / BREVO_LIST_ID remain in the Pages dashboard
# env as the fallback transport (and the waitlist contacts-list add, which
# stays on Brevo — out of scope for this migration).
[vars]
CF_ACCOUNT_ID = "fd3dbf43f8e6d8bf65bd36b02eb0abb0"
