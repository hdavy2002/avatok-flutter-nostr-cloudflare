name: Website domain

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect or configure the website domains
        type: choice
        options: [inspect, attach, inspect-dns, ensure-dns, inspect-redirect, ensure-redirect, inspect-media, ensure-media, inspect-api, ensure-api, inspect-worker-routes, ensure-worker-redirect, inspect-clerk-dns, ensure-clerk-dns, inspect-worker-auth-settings]
        required: true
        default: inspect

jobs:
  pages-domains:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Inspect or configure Pages domains
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { CF_ACCOUNT_ID, CF_API_TOKEN, REQUESTED_ACTION } = process.env;
          if (!['inspect', 'attach', 'inspect-dns', 'ensure-dns', 'inspect-redirect', 'ensure-redirect', 'inspect-media', 'ensure-media', 'inspect-api', 'ensure-api', 'inspect-worker-routes', 'ensure-worker-redirect', 'inspect-clerk-dns', 'ensure-clerk-dns', 'inspect-worker-auth-settings'].includes(REQUESTED_ACTION)) throw new Error('Invalid action');
          if (!CF_ACCOUNT_ID || !CF_API_TOKEN) throw new Error('Cloudflare credentials are unavailable');
          const brand = JSON.parse(readFileSync('Specs/brand.json', 'utf8'));
          const identity = brand.homepageIdentity;
          const root = 'https://api.cloudflare.com/client/v4';
          const projectPath = `/accounts/${CF_ACCOUNT_ID}/pages/projects/avatok-app`;
          async function request(path, method = 'GET', body) {
            const response = await fetch(root + path, {
              method,
              headers: { Authorization: `Bearer ${CF_API_TOKEN}`, 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const json = await response.json();
            if (!response.ok || !json.success) {
              const errors = (json.errors || []).map(error => `${error.code}: ${error.message}`).join('; ');
              throw new Error(`Cloudflare ${method} ${path} failed (${response.status}): ${errors}`);
            }
            return json.result;
          }
          const project = await request(projectPath);
          console.log(`Pages project: ${project.name}; production branch: ${project.production_branch}`);
          const names = [identity.domain, `www.${identity.domain}`];
          const current = await request(`${projectPath}/domains`);
          for (const name of names) {
            const domain = current.find(item => item.name === name);
            console.log(`${name}: ${domain?.status ?? 'not attached'}; DNS zone known: ${Boolean(domain?.zone_tag)}`);
            if (REQUESTED_ACTION === 'attach' && !domain) {
              const added = await request(`${projectPath}/domains`, 'POST', { name });
              console.log(`${name}: attached, status ${added.status}`);
            }
          }
          if (REQUESTED_ACTION === 'inspect-dns' || REQUESTED_ACTION === 'ensure-dns') {
            const zoneId = current.find(item => item.name === identity.domain)?.zone_tag;
            if (!zoneId) throw new Error('Pages has no zone tag for the apex domain yet');
            for (const name of names) {
              const records = await request(`/zones/${zoneId}/dns_records?name=${encodeURIComponent(name)}`);
              console.log(`${name}: ${records.length} DNS record(s)`);
              const target = `${project.name}.pages.dev`;
              if (records.length) {
                if (!records.some(record => record.type === 'CNAME' && record.content === target && record.proxied)) {
                  throw new Error(`${name} has a conflicting DNS record; no automatic replacement`);
                }
                console.log(`${name}: proxied CNAME already points to ${target}`);
              } else if (REQUESTED_ACTION === 'ensure-dns') {
                const record = await request(`/zones/${zoneId}/dns_records`, 'POST', {
                  type: 'CNAME', name, content: target, proxied: true, ttl: 1,
                });
                console.log(`${name}: created proxied CNAME, record ${record.id}`);
              }
            }
          }
          if (REQUESTED_ACTION === 'inspect-clerk-dns' || REQUESTED_ACTION === 'ensure-clerk-dns') {
            const newZoneId = current.find(item => item.name === identity.domain)?.zone_tag;
            const formerApex = brand.hosts.auth.split('.').slice(1).join('.');
            const oldZoneId = current.find(item => item.name === formerApex)?.zone_tag;
            if (!newZoneId || !oldZoneId || !brand.legacyDomains.includes(formerApex)) {
              throw new Error('Current or former Clerk DNS zone is unavailable');
            }
            for (const label of ['clerk', 'accounts', 'clkmail', 'clk._domainkey', 'clk2._domainkey']) {
              const oldName = `${label}.${formerApex}`;
              const newName = `${label}.${identity.domain}`;
              const former = await request(`/zones/${oldZoneId}/dns_records?name=${encodeURIComponent(oldName)}`);
              if (former.length !== 1 || former[0].type !== 'CNAME' || former[0].proxied) {
                throw new Error(`${oldName} must have one unproxied CNAME`);
              }
              const existing = await request(`/zones/${newZoneId}/dns_records?name=${encodeURIComponent(newName)}`);
              if (existing.length && !existing.some(item => item.type === 'CNAME' && item.content === former[0].content && !item.proxied)) {
                throw new Error(`${newName} has a conflicting DNS record`);
              }
              console.log(`${newName}: ${existing.length ? 'ready' : 'missing'}; target ${former[0].content}`);
              if (REQUESTED_ACTION === 'ensure-clerk-dns' && !existing.length) {
                await request(`/zones/${newZoneId}/dns_records`, 'POST', {
                  type: 'CNAME', name: newName, content: former[0].content, proxied: false, ttl: 1,
                });
                console.log(`${newName}: created`);
              }
            }
          }
          if (REQUESTED_ACTION === 'inspect-worker-auth-settings') {
            const settings = await request(`/accounts/${CF_ACCOUNT_ID}/workers/scripts/avatok-api/settings`);
            const bindings = settings.bindings ?? [];
            console.log(`Worker binding count: ${bindings.length}`);
            for (const name of ['CLERK_ISSUER', 'CLERK_JWKS_URL', 'WEB_BASE_URL', 'WALLET_RETURN_URL', 'BLOSSOM_BASE_URL']) {
              const binding = bindings.find(item => item.name === name);
              if (binding?.type !== 'plain_text') throw new Error(`${name} is not a plain text binding`);
              console.log(`${name}: ${binding.text}`);
            }
            console.log(`Binding types: ${JSON.stringify([...new Set(bindings.map(item => item.type))].sort())}`);
          }
          if (REQUESTED_ACTION === 'inspect-redirect' || REQUESTED_ACTION === 'ensure-redirect') {
            // The legacy website is the apex of the still-active API host. Never
            // redirect API, media, auth, or mail subdomains used by old clients.
            const formerApex = brand.hosts.api.split('.').slice(1).join('.');
            if (!brand.legacyDomains.includes(formerApex) || formerApex === identity.domain) {
              throw new Error('Former website domain is not a configured legacy domain');
            }
            const oldNames = [formerApex, `www.${formerApex}`];
            const oldDomain = current.find(item => item.name === formerApex);
            if (!oldDomain?.zone_tag) throw new Error('Former Pages apex has no zone tag');
            const zonePath = `/zones/${oldDomain.zone_tag}`;
            const phasePath = `${zonePath}/rulesets/phases/http_request_dynamic_redirect/entrypoint`;
            async function optionalRuleset() {
              const response = await fetch(root + phasePath, {
                headers: { Authorization: `Bearer ${CF_API_TOKEN}` },
              });
              if (response.status === 404) return null;
              const json = await response.json();
              if (!response.ok || !json.success) {
                const errors = (json.errors || []).map(error => `${error.code}: ${error.message}`).join('; ');
                throw new Error(`Cloudflare GET redirect rules failed (${response.status}): ${errors}`);
              }
              return json.result;
            }
            const existing = await optionalRuleset();
            console.log(`Former zone redirect rules: ${existing?.rules?.length ?? 0}`);
            for (const rule of existing?.rules ?? []) {
              console.log(`Rule ${rule.id}: ${rule.ref ?? rule.description ?? ''}; ${rule.expression}; enabled=${rule.enabled}`);
            }
            const ref = 'website_domain_migration';
            const already = existing?.rules?.find(rule => rule.ref === ref);
            if (REQUESTED_ACTION === 'ensure-redirect' && !already) {
              const expression = `http.host in {"${oldNames[0]}" "${oldNames[1]}"}`;
              const rule = {
                ref,
                description: 'Redirect legacy website to current website, keeping path and query',
                expression,
                action: 'redirect',
                action_parameters: { from_value: {
                  target_url: { expression: `concat("https://${identity.domain}", http.request.uri.path)` },
                  status_code: 301,
                  preserve_query_string: true,
                } },
              };
              if (existing) {
                await request(`${zonePath}/rulesets/${existing.id}/rules`, 'POST', { ...rule, position: { before: '' } });
              } else {
                await request(`${zonePath}/rulesets`, 'POST', {
                  name: 'Legacy website redirect', kind: 'zone', phase: 'http_request_dynamic_redirect', rules: [rule],
                });
              }
              console.log(`Created 301 redirect for ${oldNames.join(', ')} to ${identity.domain}`);
            } else if (already) {
              console.log(`Migration redirect already exists: ${already.id}`);
            }
          }
          if (REQUESTED_ACTION === 'inspect-media' || REQUESTED_ACTION === 'ensure-media') {
            const zoneId = current.find(item => item.name === identity.domain)?.zone_tag;
            if (!zoneId) throw new Error('New website zone has no zone tag');
            const bucket = 'avatok-blobs';
            const bucketPath = `/accounts/${CF_ACCOUNT_ID}/r2/buckets/${bucket}/domains/custom`;
            const listed = await request(bucketPath);
            const domains = listed.domains ?? [];
            const formerMediaHost = brand.hosts.media;
            if (!domains.some(item => item.domain === formerMediaHost && item.enabled)) {
              throw new Error(`Configured media host is not an enabled domain of ${bucket}`);
            }
            for (const item of domains) {
              console.log(`R2 ${item.domain}: enabled=${item.enabled}; ownership=${item.status?.ownership}; ssl=${item.status?.ssl}`);
            }
            const name = `media.${identity.domain}`;
            if (REQUESTED_ACTION === 'ensure-media' && !domains.some(item => item.domain === name)) {
              await request(bucketPath, 'POST', { domain: name, enabled: true, zoneId });
              console.log(`Attached ${name} to existing public media bucket ${bucket}`);
            }
          }
          if (REQUESTED_ACTION === 'inspect-api' || REQUESTED_ACTION === 'ensure-api') {
            const zoneId = current.find(item => item.name === identity.domain)?.zone_tag;
            if (!zoneId) throw new Error('New website zone has no zone tag');
            const domainPath = `/accounts/${CF_ACCOUNT_ID}/workers/domains`;
            const listed = await request(domainPath);
            const domains = Array.isArray(listed) ? listed : (listed.result ?? []);
            const former = domains.find(item => item.hostname === brand.hosts.api);
            if (!former?.service) throw new Error('Configured API host is not attached to a Worker');
            const name = `api.${identity.domain}`;
            const already = domains.find(item => item.hostname === name);
            console.log(`Existing API host ${former.hostname} serves Worker ${former.service}`);
            console.log(`${name}: ${already ? `Worker ${already.service}` : 'not attached'}`);
            if (already && already.service !== former.service) throw new Error('New API host serves a different Worker');
            if (REQUESTED_ACTION === 'ensure-api' && !already) {
              const attached = await request(domainPath, 'PUT', {
                hostname: name, service: former.service, zone_id: zoneId, zone_name: identity.domain,
              });
              console.log(`Attached ${attached.hostname} to Worker ${attached.service}`);
            }
          }
          if (REQUESTED_ACTION === 'inspect-worker-routes' || REQUESTED_ACTION === 'ensure-worker-redirect') {
            const formerApex = brand.hosts.api.split('.').slice(1).join('.');
            if (!brand.legacyDomains.includes(formerApex)) throw new Error('Former apex is not a legacy domain');
            const oldZoneId = current.find(item => item.name === formerApex)?.zone_tag;
            if (!oldZoneId) throw new Error('Former website zone has no zone tag');
            const routes = await request(`/zones/${oldZoneId}/workers/routes`);
            const names = [formerApex, `www.${formerApex}`];
            console.log(`Former zone has ${routes.length} Worker route(s)`);
            for (const route of routes) {
              if (names.some(name => route.pattern.includes(name))) {
                console.log(`Route ${route.pattern}: ${route.script ?? 'none'}`);
              }
            }
            if (REQUESTED_ACTION === 'ensure-worker-redirect') {
              const scriptName = 'avatok-legacy-website-redirect-20261007';
              const patterns = names.map(name => `${name}/*`);
              for (const pattern of patterns) {
                const existing = routes.find(route => route.pattern === pattern);
                if (existing && existing.script !== scriptName) {
                  throw new Error(`${pattern} is already routed to a different Worker`);
                }
              }
              const destination = `https://${identity.domain}`;
              const script = `addEventListener('fetch', event => {\n` +
                `  const url = new URL(event.request.url);\n` +
                `  event.respondWith(Response.redirect(${JSON.stringify(destination)} + url.pathname + url.search, 301));\n` +
                `});\n`;
              const uploaded = await fetch(root + `/accounts/${CF_ACCOUNT_ID}/workers/scripts/${scriptName}`, {
                method: 'PUT',
                headers: { Authorization: `Bearer ${CF_API_TOKEN}`, 'Content-Type': 'application/javascript' },
                body: script,
              });
              const uploadResult = await uploaded.json();
              if (!uploaded.ok || !uploadResult.success) {
                const errors = (uploadResult.errors || []).map(error => `${error.code}: ${error.message}`).join('; ');
                throw new Error(`Redirect Worker upload failed (${uploaded.status}): ${errors}`);
              }
              console.log(`Redirect Worker ${scriptName} uploaded`);
              for (const pattern of patterns) {
                if (routes.some(route => route.pattern === pattern)) continue;
                const added = await request(`/zones/${oldZoneId}/workers/routes`, 'POST', {
                  pattern, script: scriptName,
                });
                console.log(`Created route ${added.pattern} -> ${added.script}`);
              }
            }
          }
          NODE
