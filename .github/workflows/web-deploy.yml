# Build the avatok.ai web client (web/) and deploy it to the Cloudflare Pages
# project `avatok-app`. This repo's Pages project is NOT wired to Cloudflare's
# git integration. Only an explicit manual dispatch from main publishes it.
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Cloudflare Pages: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID — the account id that owns avatok-app
name: Deploy web (Cloudflare Pages)

on:
  # Builds and deployments require an explicit owner-requested dispatch.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified build to production (main only)
        type: boolean
        default: true
        required: true

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hdfc-safety:
    uses: ./.github/workflows/hdfc-sms-verify.yml
  # Independent gates start together; deployment still requires both.
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Guard explicit dispatch and production branch
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 1
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Production web deployment requires a manual dispatch from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      # [SAATHUM-BRAND-CENTRAL-GUARD-2] never deploy a hand-typed brand name/domain
      - name: No new hand-typed brand name/domain
        run: python3 scripts/check_brand_literals.py && python3 scripts/gen_brand.py --check

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # [SAATHUM-DOMAIN-LEGACY-1] The Clerk publishable key is a public value that is
      # just "pk_live_" + base64("<clerk host>$"), and the API base is the brand api
      # host — both come from Specs/brand.json so a domain switch needs no workflow
      # edit. (Clerk's frontend API host must be the one whose key this encodes.)
      - name: Derive brand build vars
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import base64, json
          b = json.load(open("Specs/brand.json", encoding="utf-8"))
          h = b["hosts"]
          print("PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_" + base64.b64encode((h["auth"] + "$").encode()).decode())
          print("PUBLIC_API_BASE=https://" + h["api"])
          PY

      - name: Build
        working-directory: web
        # PUBLIC_* vars are inlined into the browser bundle by Astro at BUILD
        # time (src/lib/config.ts), so they must be present here — setting them
        # on the Pages project afterwards does nothing for an already-built
        # bundle. Until 2026-08-26 this step had no env at all, so
        # CLERK_PUBLISHABLE_KEY came out `undefined` and every auth island
        # rendered its "Sign-in isn't set up yet" fallback. That is the ONLY
        # reason avatok.ai/sign-in did not work — the Worker has verified Clerk
        # JWTs as the sole auth authority since 2026-07-02 (worker/src/auth.ts).
        #
        # A Clerk PUBLISHABLE key is public by design: it is shipped inside the
        # browser bundle of every Clerk site and inside the Android app. It is
        # NOT a secret and deliberately lives in plaintext here so the build can
        # never silently lose it to an unset repo secret. The SECRET key
        # (sk_live_…) is server-side only and must never appear in this repo.
        #
        # The key is derived from Specs/brand.json hosts.auth. Keep the live
        # Worker's CLERK_ISSUER and CLERK_JWKS_URL in sync on domain switch day.
        env:
          # [SAATHUM-DOMAIN-LEGACY-1] PUBLIC_CLERK_PUBLISHABLE_KEY and PUBLIC_API_BASE
          # are no longer typed here: the "Derive brand build vars" step above writes
          # them to $GITHUB_ENV from Specs/brand.json (hosts.auth / hosts.api).
          # [WEB-POSTHOG-1] `release` super property on every web event, so an
          # issue/error can be filtered by exactly which deploy produced it —
          # same idea as the app's git-SHA `release` prop (analytics.dart).
          PUBLIC_RELEASE_SHA: ${{ github.sha }}
        run: npm run build      # runs prebuild (zine tokens) + astro build

      - name: Check preview session readiness and account isolation
        working-directory: web
        run: node --test test/preview_session.test.mjs

      # Run independent post-build contracts to completion so one stale
      # assertion cannot hide other actionable failures from the same run.
      - name: Check all independent release contracts
        working-directory: web
        run: node scripts/check-release-contracts.mjs

      # The same immutable build is tested and, only after all gates, deployed.
      # Validation-only dispatches need the artifact too.
      - name: Save web build for browser checks and deployment
        uses: actions/upload-artifact@v6
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  browser-check:
    needs: build
    runs-on: ubuntu-24.04
    # Keep this version equal to web/package.json. The image already contains
    # the matching browsers and OS libraries; npm ci supplies the test package.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout browser contracts
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked browser dependencies
        working-directory: web
        run: npm ci

      - name: Download build under test
        uses: actions/download-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist

      - name: Check homepage in desktop and mobile browsers
        working-directory: web
        run: node scripts/check-homepage-browser.mjs

      - name: Save homepage visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: homepage-visual-review
          path: web/homepage-review
          retention-days: 3

  deploy:
    if: inputs.publish
    needs: [build, hdfc-safety, browser-check]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download verified production artifact
        uses: actions/download-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist

      - name: Deploy to Cloudflare Pages (avatok-app)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=avatok-app --branch=main --commit-hash=${{ github.sha }}

      # Automatic deploy tracking: drop a PostHog annotation (commit SHA + message)
      # on the project timeline so every web deploy is visible against metrics and
      # errors. Best-effort — skips cleanly if POSTHOG_PERSONAL_API_KEY isn't set
      # and never fails the deploy. Needs repo secret POSTHOG_PERSONAL_API_KEY (phx_…).
      - name: PostHog deploy annotation
        if: success()
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_HOST: https://eu.posthog.com
          POSTHOG_PROJECT_ID: '139917'
          GIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$POSTHOG_KEY" ]; then echo "POSTHOG_PERSONAL_API_KEY unset — skipping annotation"; exit 0; fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SUBJECT=$(printf '%s' "${COMMIT_MSG:-manual deploy}" | head -n1)
          curl -sS -X POST "$POSTHOG_HOST/api/projects/$POSTHOG_PROJECT_ID/annotations/" \
            -H "Authorization: Bearer $POSTHOG_KEY" -H "Content-Type: application/json" \
            --data "$(jq -n --arg c "Web deploy ${GIT_SHA:0:7} — $SUBJECT" --arg d "$NOW" '{content:$c,date_marker:$d,scope:"project"}')" \
            -o /dev/null -w "PostHog annotation HTTP %{http_code}\n" || echo "annotation post failed (non-fatal)"

      # [SAATHUM-PREETI-1] Tell the Worker to re-sync Preeti's site knowledge now that
      # the new pages are live. Best-effort: never fails the deploy, and SKIPS LOUDLY
      # when the PREETI_SYNC_TOKEN repo secret is absent. The API host is read from
      # Specs/brand.json (apiOrigin if present, else hosts.api) - never typed here.
      - name: Preeti knowledge sync
        if: success()
        continue-on-error: true
        env:
          PREETI_SYNC_TOKEN: ${{ secrets.PREETI_SYNC_TOKEN }}
        run: |
          if [ -z "$PREETI_SYNC_TOKEN" ]; then
            echo "::warning::SKIPPED: PREETI_SYNC_TOKEN not set - Preeti knowledge NOT synced after this deploy"
            echo "SKIPPED: PREETI_SYNC_TOKEN not set"
            exit 0
          fi
          API=$(jq -r '.apiOrigin // .hosts.api // empty' Specs/brand.json)
          if [ -z "$API" ]; then echo "::warning::SKIPPED: no API host in Specs/brand.json"; exit 0; fi
          case "$API" in http*) ORIGIN="$API" ;; *) ORIGIN="https://$API" ;; esac
          curl -fsS -X POST "$ORIGIN/api/preeti/internal/sync" \
            -H "x-preeti-sync-token: $PREETI_SYNC_TOKEN" \
            -o /dev/null -w "Preeti sync HTTP %{http_code}\n" || echo "::warning::Preeti sync call failed (non-fatal)"
