name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options: [staging, prod]
      apply_media_jobs_neutral:
        description: Rename the historical media job table and queue id column to neutral names
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard branch and target
        run: |
          if [ "${{ inputs.environment }}" = "prod" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Production Worker deployments must use main."
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "staging" ] && [ "$GITHUB_REF_NAME" != "staging" ]; then
            echo "::error::Staging Worker deployments must use staging."
            exit 1
          fi

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Select target
        run: printf '%s\n' '${{ inputs.environment }}' > .avatok-target

      - name: Apply neutral media job migration
        if: ${{ inputs.apply_media_jobs_neutral }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_PROD: ${{ inputs.environment == 'prod' && '1' || '0' }}
        run: scripts/cf.sh worker d1 execute DB_MEDIA --remote --file=worker/migrations/2026-08-19-media-jobs-neutral.sql

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_PROD: ${{ inputs.environment == 'prod' && '1' || '0' }}
        run: scripts/cf.sh worker deploy
