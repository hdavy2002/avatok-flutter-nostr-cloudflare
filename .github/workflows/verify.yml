# [CI-VERIFY-1] Full verify gate: unit tests (worker + consumers, incl. the new
# ai_billing / fanout / fault-injection coverage) + a Flutter static-analysis
# pass, all in CI — this repo's toolchains are broken locally BY DESIGN
# (CLAUDE.md "No local build tools"), so this is the only place any of it runs.
#
# TRIGGER: workflow_dispatch ONLY. Deliberately NOT `push:` and NOT
# `pull_request:` — the repo is manual-build-only by owner decision (2026-07-04)
# and scripts/git_safe_push.py refuses to push when ANY workflow has an active
# `push:` trigger. typecheck.yml already gates `tsc --noEmit` on every PR
# (pull_request); this workflow is the deeper, slower check (vitest + flutter
# analyze) that runs on demand instead of on every push, so it never becomes a
# reason git_safe_push.py blocks a push. This workflow BUILDS NOTHING and
# DEPLOYS NOTHING — no artifact upload, no wrangler/cf.sh call, no Play/Release
# step. Run it by hand from the Actions tab or `gh workflow run verify.yml`.
name: verify

on:
  workflow_dispatch:

jobs:
  worker-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # affiliate_commission_lifecycle.test.ts uses node:sqlite, which was
          # added in Node 22.5. Keep the test runner aligned with that contract.
          node-version: 22
      - name: Install worker deps
        working-directory: worker
        run: npm ci --no-audit --no-fund --silent
      - name: Type-check worker (tsc --noEmit)
        working-directory: worker
        run: npm run typecheck
      # [AI-FLAG-CONTRACT-1] Client-key <-> server-key config contract. Fails
      # fast (before the slower vitest run) on a fake flag (client reads a key
      # the Worker's DEFAULTS doesn't declare — see CLAUDE.md "FAKE FLAGS" and
      # ROOT-CAUSE-REPORT-RECURRING-ISSUES-2026-07-25.md §18/§54), a
      # numeric-typed DEFAULTS key missing from numericKeys (un-tunable via
      # scripts/flags.sh), or a critical gate/cap declared but read nowhere.
      # No deps beyond node:fs/node:path — runs with the Node 20 already set
      # up above, no `npm ci` needed.
      - name: Config contract (client/server flag symmetry)
        if: always()
        run: node scripts/check-config-contract.mjs
      - name: Unit tests (vitest)
        if: always()
        working-directory: worker
        # Scoped to test/ via --dir — src/spam/scoring.test.ts is a pre-existing
        # stub with no test suite, which vitest's default glob treats as a
        # failure. (A bare positional "test" is a NAME FILTER and still matches
        # that stub's filename — must be --dir.)
        run: npx vitest run --dir test
  consumers-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install consumers deps
        working-directory: consumers
        run: npm ci --no-audit --no-fund --silent
      - name: Type-check consumers (tsc --noEmit)
        working-directory: consumers
        run: npm run typecheck
      - name: Unit tests (vitest)
        working-directory: consumers
        run: npx vitest run

  # [UI-DS-GUARD-1] Design-system drift guard. Pure python3, NO Flutter
  # toolchain, no pub deps — runs in ~1s in a bare container, which is why it
  # is its own job rather than a step inside the 20-minute flutter-analyze job
  # below (a design regression should not wait on a Flutter SDK download).
  #
  # It is baselined: tool/design_guard_baseline.json records the violations
  # that existed when the guard landed, so it is green on day one and only
  # fires on NEW drift. The correct response to a failure is to use a token,
  # NOT to run --update-baseline. See CLAUDE.md "Design-system guard".
  #
  # Also runs on every PR via typecheck.yml (pull_request) — that is the
  # trigger that actually catches drift early; this copy is the on-demand one.
  design-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Step names carry the EXACT local reproduce command on purpose: a dev
      # who trips this can copy it straight out of the Actions log.
      - name: No raw colours outside the token files -- run locally with `python3 tool/check_design_guard.py --check colours`
        run: python3 tool/check_design_guard.py --check colours
      - name: No bare Material Icons.* in feature code -- run locally with `python3 tool/check_design_guard.py --check icons`
        if: always()
        run: python3 tool/check_design_guard.py --check icons

  # [SHIP-GATE-1] Ship-readiness gate — the on-demand copy, and the ONLY place
  # the telemetry check runs. Also on every PR via typecheck.yml, but WITHOUT
  # telemetry there (a PR must not fail on the production behaviour of someone
  # else's feature).
  #
  # THREE CHECKS, and the third is the one that would have caught 2026-08-08:
  #   flags     — a client key the Worker never declares is a FAKE flag.
  #   manifest  — every shipped issue declares, in advance, the exact telemetry
  #               value that means it worked (tool/ship_manifest.json).
  #   telemetry — queries PostHog and fails when the events are ABSENT *or*
  #               PRESENT-BUT-CARRYING-A-FAILURE-VALUE, plus the two-phone gate
  #               (a two-sided feature with one phone on the new build is
  #               untestable by construction).
  #
  # Without POSTHOG_PERSONAL_API_KEY in repo secrets the telemetry half prints a
  # loud SKIP and exits 0 — a missing secret must never fail CI, and must never
  # be mistaken for a pass. Set the secret to make it real.
  ship-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # --check manifest reads `git log --since`
      - name: Flags + success manifest + production telemetry -- run locally with `python3 tool/check_ship_readiness.py --check all`
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: python3 tool/check_ship_readiness.py --check all

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pins as .github/workflows/android.yml — analyze must see the same
      # generated android/ platform files and build_runner output the real APK
      # build sees, or it can pass here and fail there (or vice versa).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin matches android.yml: last stable BEFORE Flutter 3.44 (which marked
          # IconData `final` and breaks phosphor_flutter 2.1.0). See android.yml's
          # "Set up Flutter" step comment for the full explanation.
          flutter-version: 3.41.x
          channel: stable
          cache: true

      - name: Generate android/ platform files
        working-directory: app
        run: flutter create --platforms=android --org ai.avatok --project-name avatok_call .

      - name: Configure Android (permissions, minSdk)
        working-directory: app
        run: python3 tool/postcreate.py

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Generate code (drift / build_runner)
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      # BLOCKING on ERRORS only. The repo carries ~84 pre-existing lint-class
      # warnings (unused imports/elements, unnecessary assertions) across many
      # feature domains; failing the gate on those blocks every push over debt
      # owned by other workstreams. Errors (compile breaks, type errors) remain
      # fatal — that is the purpose of this gate. Warning cleanup is tracked
      # separately.
      - name: Analyze (fatal on errors)
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter unit tests
        working-directory: app
        run: flutter test
