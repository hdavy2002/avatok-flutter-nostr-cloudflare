# [CI-VERIFY-1] Full verify gate: unit tests (worker + consumers, incl. the new
# ai_billing / fanout / fault-injection coverage) + a Flutter static-analysis
# pass, all in CI — this repo's toolchains are broken locally BY DESIGN
# (CLAUDE.md "No local build tools"), so this is the only place any of it runs.
#
# TRIGGER: workflow_dispatch ONLY. Deliberately NOT `push:` and NOT
# `pull_request:` — the repo is manual-build-only by owner decision (2026-07-04)
# and scripts/git_safe_push.py refuses to push when ANY workflow has an active
# `push:` trigger. typecheck.yml already gates `tsc --noEmit` on every PR
# (pull_request); this workflow is the deeper, slower check (vitest + flutter
# analyze) that runs on demand instead of on every push, so it never becomes a
# reason git_safe_push.py blocks a push. This workflow BUILDS NOTHING and
# DEPLOYS NOTHING — no artifact upload, no wrangler/cf.sh call, no Play/Release
# step. Run it by hand from the Actions tab or `gh workflow run verify.yml`.
name: verify

on:
  workflow_dispatch:
    inputs:
      commercial_only:
        description: 'Run focused commercial media checks; full verification remains the default'
        type: boolean
        default: false
      # [CAL-2026-09-15] Focused calendar/availability validation for the
      # undeployed review branch. Default false ⇒ the full gate is unchanged.
      # When true, only the calendar-owned SQL suites, web calendar/device
      # checks, focused Flutter analysis + calendar tests and the design guard
      # run (plus offline flags+manifest). It never builds, packages or deploys.
      calendar_only:
        description: 'Run focused calendar/availability checks; full verification remains the default'
        type: boolean
        default: false


jobs:
  hdfc-safety:
    uses: ./.github/workflows/hdfc-sms-verify.yml
  worker-ts:
    if: ${{ !inputs.commercial_only && !inputs.calendar_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # affiliate_commission_lifecycle.test.ts uses node:sqlite, which was
          # added in Node 22.5. Keep the test runner aligned with that contract.
          node-version: 22
      - name: Install worker deps
        working-directory: worker
        run: npm ci --no-audit --no-fund --silent
      - name: Type-check worker (tsc --noEmit)
        working-directory: worker
        run: npm run typecheck
      # [AI-FLAG-CONTRACT-1] Client-key <-> server-key config contract. Fails
      # fast (before the slower vitest run) on a fake flag (client reads a key
      # the Worker's DEFAULTS doesn't declare — see CLAUDE.md "FAKE FLAGS" and
      # ROOT-CAUSE-REPORT-RECURRING-ISSUES-2026-07-25.md §18/§54), a
      # numeric-typed DEFAULTS key missing from numericKeys (un-tunable via
      # scripts/flags.sh), or a critical gate/cap declared but read nowhere.
      # No deps beyond node:fs/node:path — runs with the Node 20 already set
      # up above, no `npm ci` needed.
      - name: Config contract (client/server flag symmetry)
        if: always()
        run: node scripts/check-config-contract.mjs
      - name: Unit tests (vitest)
        if: always()
        working-directory: worker
        # Scoped to test/ via --dir — src/spam/scoring.test.ts is a pre-existing
        # stub with no test suite, which vitest's default glob treats as a
        # failure. (A bare positional "test" is a NAME FILTER and still matches
        # that stub's filename — must be --dir.)
        run: npx vitest run --dir test

  # [CAL-2026-09-15] Focused calendar/availability worker gate. This is the
  # `calendar_only` counterpart to worker-ts: the same Node 22 runtime and
  # worker typecheck, but the vitest subset is limited to the calendar-owned
  # SQL suites. Files are discovered dynamically so a newly added
  # availability_*.test.ts / calendar_*.test.ts is exercised without editing
  # the workflow, and the step FAILS if the discovery is empty (a green run
  # over zero suites is not a pass). It builds and deploys nothing.
  calendar-worker-ts:
    if: ${{ inputs.calendar_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by every *_sqlite.test.ts shim) needs Node 22.5+.
          node-version: 22
      - name: Install worker deps
        working-directory: worker
        run: npm ci --no-audit --no-fund --silent
      - name: Type-check worker (tsc --noEmit)
        working-directory: worker
        run: npm run typecheck
      - name: Focused availability + calendar SQL suites (discovered, fail if none)
        working-directory: worker
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(test/availability_*.test.ts test/calendar_*.test.ts)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "verify[calendar_only]: no availability/calendar suites discovered under worker/test" >&2
            exit 1
          fi
          names=()
          for f in "${files[@]}"; do names+=("${f#test/}"); done
          printf 'verify[calendar_only]: running %d focused worker suite(s):\n' "${#names[@]}"
          printf '  %s\n' "${names[@]}"
          # --dir test prevents the pre-existing src/spam/scoring.test.ts stub
          # (no suite) from being collected. Positional args are file filters,
          # so the bare basenames narrow the run to the discovered files only.
          # Never glob all of test/ here.
          npx vitest run --dir test "${names[@]}"

  consumers-ts:
    if: ${{ !inputs.commercial_only && !inputs.calendar_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install consumers deps
        working-directory: consumers
        run: npm ci --no-audit --no-fund --silent
      - name: Type-check consumers (tsc --noEmit)
        working-directory: consumers
        run: npm run typecheck
      - name: Unit tests (vitest)
        working-directory: consumers
        run: npx vitest run

  # [UI-DS-GUARD-1] Design-system drift guard. Pure python3, NO Flutter
  # toolchain, no pub deps — runs in ~1s in a bare container, which is why it
  # is its own job rather than a step inside the 20-minute flutter-analyze job
  # below (a design regression should not wait on a Flutter SDK download).
  #
  # It is baselined: tool/design_guard_baseline.json records the violations
  # that existed when the guard landed, so it is green on day one and only
  # fires on NEW drift. The correct response to a failure is to use a token,
  # NOT to run --update-baseline. See CLAUDE.md "Design-system guard".
  #
  # Also runs on every PR via typecheck.yml (pull_request) — that is the
  # trigger that actually catches drift early; this copy is the on-demand one.
  design-guard:
    if: ${{ !inputs.commercial_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Step names carry the EXACT local reproduce command on purpose: a dev
      # who trips this can copy it straight out of the Actions log.
      - name: No raw colours outside the token files -- run locally with `python3 tool/check_design_guard.py --check colours`
        run: python3 tool/check_design_guard.py --check colours
      - name: No bare Material Icons.* in feature code -- run locally with `python3 tool/check_design_guard.py --check icons`
        if: always()
        run: python3 tool/check_design_guard.py --check icons

  # [SHIP-GATE-1] Ship-readiness gate — the on-demand copy, and the ONLY place
  # the telemetry check runs. Also on every PR via typecheck.yml, but WITHOUT
  # telemetry there (a PR must not fail on the production behaviour of someone
  # else's feature).
  #
  # THREE CHECKS, and the third is the one that would have caught 2026-08-08:
  #   flags     — a client key the Worker never declares is a FAKE flag.
  #   manifest  — every shipped issue declares, in advance, the exact telemetry
  #               value that means it worked (tool/ship_manifest.json).
  #   telemetry — queries PostHog and fails when the events are ABSENT *or*
  #               PRESENT-BUT-CARRYING-A-FAILURE-VALUE, plus the two-phone gate
  #               (a two-sided feature with one phone on the new build is
  #               untestable by construction).
  #
  # Without POSTHOG_PERSONAL_API_KEY in repo secrets the telemetry half prints a
  # loud SKIP and exits 0 — a missing secret must never fail CI, and must never
  # be mistaken for a pass. Set the secret to make it real.
  ship-gate:
    if: ${{ !inputs.commercial_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # --check manifest reads `git log --since`
      # [CAL-2026-09-15] Focused calendar runs target an UNDEPLOYED review
      # branch, so the production telemetry verdict is meaningless there (and
      # would need a network secret). The offline checks still run: `flags`
      # (a client key the Worker never declares is a fake flag) and `manifest`
      # (every shipped issue declares its success value). No telemetry is
      # queried and no POSTHOG key is passed in this mode.
      - name: Flags + success manifest (offline; focused review branch)
        if: ${{ inputs.calendar_only }}
        run: |
          python3 tool/check_ship_readiness.py --check flags
          python3 tool/check_ship_readiness.py --check manifest
      - name: Flags + success manifest + production telemetry -- run locally with `python3 tool/check_ship_readiness.py --check all`
        if: ${{ !inputs.calendar_only }}
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: python3 tool/check_ship_readiness.py --check all

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pins as .github/workflows/android.yml — analyze must see the same
      # generated android/ platform files and build_runner output the real APK
      # build sees, or it can pass here and fail there (or vice versa).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin matches android.yml: last stable BEFORE Flutter 3.44 (which marked
          # IconData `final` and breaks phosphor_flutter 2.1.0). See android.yml's
          # "Set up Flutter" step comment for the full explanation.
          flutter-version: 3.41.x
          channel: stable
          cache: true

      - name: Generate android/ platform files
        working-directory: app
        run: flutter create --platforms=android --org com.saathum --project-name app .

      - name: Configure Android (permissions, minSdk)
        working-directory: app
        run: python3 tool/postcreate.py

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Generate code (drift / build_runner)
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      # BLOCKING on ERRORS only. The repo carries ~84 pre-existing lint-class
      # warnings (unused imports/elements, unnecessary assertions) across many
      # feature domains; failing the gate on those blocks every push over debt
      # owned by other workstreams. Errors (compile breaks, type errors) remain
      # fatal — that is the purpose of this gate. Warning cleanup is tracked
      # separately.
      - name: Analyze (fatal on errors)
        if: ${{ !inputs.commercial_only && !inputs.calendar_only }}
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # [CAL-2026-09-15] Focused calendar analysis. Scoped to the calendar
      # feature and the actual native listing wizard the audit found missing the
      # shared/custom/exclusive controls, so the ~84 pre-existing repo-wide
      # lint warnings do not mask a regression in the owned surface. Standard
      # mode still runs the FULL analyze above, unchanged.
      - name: Analyze calendar + native listing wizard (fatal on errors)
        if: ${{ inputs.calendar_only }}
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/calendar lib/features/marketplace/native_listing

      - name: Analyze commercial media (fatal on errors)
        if: ${{ inputs.commercial_only }}
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/commercial_getstream

      - name: Focused commercial device regression tests
        if: ${{ inputs.commercial_only }}
        working-directory: app
        run: flutter test test/features/commercial_getstream test/commercial_speaker_test.dart

      # Dynamically discover the owned Flutter regression tests by name prefix.
      # A missing discovery is a FAILURE (a pass over zero files is not a pass);
      # when the native-listing worker lands test/native_listing_calendar*_test.dart
      # it is picked up without editing this workflow.
      - name: Focused calendar + native listing tests (discovered, fail if none)
        if: ${{ inputs.calendar_only }}
        working-directory: app
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(test/calendar*_test.dart test/native_listing_calendar*_test.dart)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "verify[calendar_only]: no calendar/native-listing Flutter tests discovered under app/test" >&2
            exit 1
          fi
          printf 'verify[calendar_only]: running %d focused Flutter test file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          flutter test "${files[@]}"

      - name: Flutter unit tests
        if: ${{ !inputs.commercial_only && !inputs.calendar_only }}
        working-directory: app
        run: flutter test

  commercial-web-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # [CAL-2026-09-15] The baseline `tsc --noEmit` run fails on
      # src/lib/help.ts implicit-any because those errors are caused by the
      # MISSING Astro generated content types (`astro:content`), not by the
      # code. `astro sync` regenerates `.astro/types.d.ts` (which tsconfig
      # includes) from src/content.config.ts — it is a type-generation step,
      # NOT a build, and it does not weaken TS or edit help.ts.
      - name: Generate Astro content types (npx astro sync)
        working-directory: web
        run: npx astro sync
      - run: npx tsc --noEmit
        working-directory: web
      # [WEB-TESTS-1] node:test + node:assert is this folder's runner (see
      # test/sendMail.test.ts), and every file in test/*.test.ts is a real
      # regression gate — the calendar/availability tests land in the same
      # directory, so the glob is what keeps them RUNNING alongside the device
      # checks. Node 22 above covers node:sqlite and --experimental-strip-types;
      # a test that needs JSX or a bundler does not belong in this step (it does
      # not transform .tsx).
      - name: Web unit tests (node:test) — full device checks + calendar regressions
        if: ${{ !inputs.calendar_only }}
        working-directory: web
        run: node --experimental-strip-types --test test/*.test.ts
      # Focused calendar run: the explicit calendar and device files, so the
      # subset cannot silently widen or narrow with an unrelated glob change.
      - name: Web unit tests (node:test) — focused calendar + device checks
        if: ${{ inputs.calendar_only }}
        working-directory: web
        run: node --experimental-strip-types --test test/calendar_core.test.ts test/device_checks.test.ts
