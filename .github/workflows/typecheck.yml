# [MKT7-CI] TypeScript type-check gate for the Cloudflare Workers.
#
# WHY THIS EXISTS: worker/ and consumers/ both ship to production via `wrangler
# deploy`, which bundles with esbuild — and esbuild STRIPS types without checking
# them. `npm run typecheck` (tsc --noEmit) existed in both package.json files but
# NO workflow ran it, so ~20 type errors shipped to prod invisibly for months
# (found 2026-07-18, including a real duplicate-import in index.ts). This gate
# closes that hole: from now on a type error is caught here instead of in prod.
#
# TRIGGER: pull_request + manual only — deliberately NOT `push:`. This is not a
# build (it deploys nothing, runs only `tsc --noEmit`), but the repo is manual-
# only by owner decision and scripts/git_safe_push.py refuses to push when any
# workflow has an active `push:` trigger. pull_request gates every PR into main;
# workflow_dispatch lets anyone run it by hand from the Actions tab.
name: typecheck

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install worker deps
        working-directory: worker
        run: npm ci --no-audit --no-fund --silent
      - name: Type-check worker
        working-directory: worker
        run: npm run typecheck
      # [WALLET-FREEZE-1] Runs on every PR, even when the change is unrelated to
      # AvaWallet. This prevents a future transaction type or layout edit from
      # silently hiding money/history again.
      - name: AvaWallet regression contract
        run: |
          node scripts/check-wallet-contract.mjs
          cd worker
          npx vitest run test/wallet_statement_policy.test.ts

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install consumers deps
        working-directory: consumers
        run: npm ci --no-audit --no-fund --silent
      - name: Type-check consumers
        working-directory: consumers
        run: npm run typecheck

  # [UI-DS-GUARD-1] Design-system drift guard (raw colour literals + bare
  # Material icons in app/lib). Lives HERE, not only in verify.yml, because
  # verify.yml is workflow_dispatch-only and nobody runs it by hand before a
  # merge — pull_request is the trigger that actually catches drift while the
  # change is still a diff. Costs ~15s: plain python3, no pub/npm deps, no
  # Flutter SDK, and it builds and deploys nothing.
  #
  # Baselined against tool/design_guard_baseline.json, so it was green the day
  # it landed and only fails on NEW violations. If it fails, USE A TOKEN —
  # do not run --update-baseline. See CLAUDE.md "Design-system guard".
  design-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Step names carry the EXACT local reproduce command on purpose: a dev
      # who trips this can copy it straight out of the Actions log.
      - name: No raw colours outside the token files -- run locally with `python3 tool/check_design_guard.py --check colours`
        run: python3 tool/check_design_guard.py --check colours
      - name: No bare Material Icons.* in feature code -- run locally with `python3 tool/check_design_guard.py --check icons`
        if: always()
        run: python3 tool/check_design_guard.py --check icons

      # [LIST-DEFAULTS-LEN-1 2026-09-05] The wizard's prefilled defaults must fit
      # the Worker's attrs limits. They are applied automatically from step 4 and
      # sent on EVERY save, so an over-length default 422s a creator on a step
      # they have not reached, over content they never typed — and per-step
      # client validation cannot catch it, because it only checks the step in
      # front of the creator. Three were already over the cap when this landed.
      - name: Prefilled listing defaults fit the worker's limits -- run locally with `python3 tool/check_listing_defaults.py`
        if: always()
        run: python3 tool/check_listing_defaults.py

  # [SHIP-GATE-1] Ship-readiness gate. Same shape and same reasoning as
  # design-guard above: plain python3, no deps, ~1s, builds and deploys nothing,
  # and it lives on pull_request because that is the trigger that actually
  # catches the mistake while the change is still a diff.
  #
  # `--check all` here runs the two OFFLINE checks:
  #   flags     — a client key the Worker never declares is a FAKE flag; the
  #               kill switch documented above the getter does not exist.
  #   manifest  — every issue id shipped in the window that touched app/ or
  #               worker/ must declare, IN ADVANCE, the exact telemetry value
  #               that means it worked (tool/ship_manifest.json).
  # The telemetry check needs a PostHog key and is deliberately NOT wired here:
  # no POSTHOG_PERSONAL_API_KEY is passed to this job, so it prints a loud SKIP
  # and exits 0. A PR must not fail on the production behaviour of somebody
  # else's feature. verify.yml is where telemetry runs.
  #
  # WHY: over 2026-08-07/08 four call fixes shipped and three did nothing. The
  # telemetry said `presence=unknown decision=ring_unknown` on every call and
  # was reported as "telemetry is flowing". See CLAUDE.md "Ship gate".
  ship-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --check manifest reads `git log --since`; the default shallow
          # checkout (fetch-depth 1) has exactly one commit and would report
          # that nothing shipped, forever.
          fetch-depth: 0
      - name: Flags declared server-side + every shipped issue declares success -- run locally with `python3 tool/check_ship_readiness.py --check all`
        run: python3 tool/check_ship_readiness.py --check all
