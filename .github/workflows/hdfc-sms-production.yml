name: Configure HDFC SMS smoke rail (production)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit maintenance step; never enables automatic payment matching
        required: true
        default: deploy-contained
        type: choice
        options: [deploy-contained, configure-secrets]
permissions:
  contents: read
concurrency:
  group: hdfc-sms-production
  cancel-in-progress: false
jobs:
  safety:
    uses: ./.github/workflows/hdfc-sms-verify.yml
  configure:
    needs: safety
    runs-on: ubuntu-latest
    environment: production
    env:
      AVATOK_TARGET: prod
      ALLOW_PROD: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Guard exact production revision and maintenance phase
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Revision: %s\nOperation: %s\n' "$GITHUB_SHA" "$OPERATION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Pause new intents and automatic confirmation
        run: scripts/flags.sh set hdfcSmsEnabled=false
      - name: Deploy combined smoke v2 Worker (creation and claim remain paused)
        if: inputs.operation == 'deploy-contained'
        run: scripts/cf.sh worker deploy
      - name: Register matched production companion configuration
        if: inputs.operation == 'configure-secrets'
        env:
          HDFC_UPI_VPA: ${{ secrets.HDFC_UPI_VPA }}
          HDFC_UPI_PAYEE_NAME: ${{ secrets.HDFC_UPI_PAYEE_NAME }}
          HDFC_SMS_DEVICE_ID: ${{ secrets.HDFC_SMS_DEVICE_ID }}
          HDFC_SMS_DEVICE_SECRET: ${{ secrets.HDFC_SMS_DEVICE_SECRET }}
          HDFC_SMS_ACCOUNT_SUFFIX: ${{ secrets.HDFC_SMS_ACCOUNT_SUFFIX }}
        run: |
          set -euo pipefail
          names=(HDFC_UPI_VPA HDFC_UPI_PAYEE_NAME HDFC_SMS_DEVICE_ID HDFC_SMS_DEVICE_SECRET HDFC_SMS_ACCOUNT_SUFFIX)
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Required configuration is missing: $name"
              exit 1
            fi
          done
          [[ "$HDFC_UPI_VPA" == *@* ]]
          [[ "$HDFC_SMS_ACCOUNT_SUFFIX" =~ ^[0-9]{4,6}$ ]]
          for name in "${names[@]}"; do
            printf '%s' "${!name}" | scripts/cf.sh worker secret put "$name"
          done
      - name: Record paused rollout checkpoint
        run: |
          echo 'HDFC automatic processing remains DISABLED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verify existing v2 readiness without reseeding historical data; apply any new additive schema migration and verify the matching web release before enabling the controlled test.' >> "$GITHUB_STEP_SUMMARY"

