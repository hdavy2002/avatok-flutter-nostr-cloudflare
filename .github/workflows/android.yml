name: Android build

# All app builds run on GitHub Actions — never on a local machine.
# Builds the app under app/. Production "ship it" runs create the arm64 APK
# first for immediate side-loading, then the signed AAB for Closed Alpha review.
# The workflow publishes to Google Play Closed testing (Alpha), updates latestAppBuild,
# and verifies the matching FCM update notification reached the fan-out worker.

# Staging lane (creator-marketplace Phase 1, A1): pushes to the `staging`
# branch build with --dart-define=AVATOK_ENV=staging (app talks to
# api-staging.avatok.ai) and publish under the staging-latest tag.
#
# AUTO-BUILD ON PUSH IS DISABLED (owner decision 2026-07-04: "no auto build
# unless I say so — just push to git and I'll trigger a build manually").
# Builds now run ONLY when the owner starts them by hand from the Actions tab
# (Run workflow) or `gh workflow run android.yml`. Agents may push commits
# freely; they must NEVER trigger this workflow without an explicit owner
# request. Re-enable the `push:` block below to resume auto-build on app/ changes.
on:
  # push:
  #   branches: [main, staging]
  #   paths:
  #     - 'app/**'
  #     - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which backend does this build talk to?'
        required: true
        default: staging
        type: choice
        options: [staging, prod]
      artifact:
        # Play receives only the AAB, but a `both` run may also create an APK for
        # immediate side-loading while the Closed Alpha AAB waits for review.
        description: 'Artifact format (Ship it uses Both: APK sideload + Play AAB)'
        required: true
        default: aab
        type: choice
        options: [aab, apk, both]
      play_track:
        # [AVA-UPDATE-AUTO] Publishing to Play is what makes automatic updates
        # possible AT ALL: Play only auto-updates (and only serves the in-app
        # updater) for installs IT owns. A side-loaded APK can never be updated by
        # either mechanism, no matter what the app code does.
        #
        # DEFAULT IS `alpha`, and that default is the feature. It shipped as
        # `none` for one day and the owner immediately hit the thing it causes: he
        # ran a build, the publish step silently skipped because he'd left the
        # dropdown alone, and he was back to downloading the .aab and uploading it
        # to Play by hand — the exact manual work this automation exists to remove.
        # A safe-looking default that makes the common path fail silently is not
        # safe. Closed Alpha is the owner's canonical tester release track; pick
        # `none` explicitly if you want a build artifact without touching Play.
        #
        # `production` is deliberately NOT an option: it makes a build live for real
        # users once review passes, and that belongs to a deliberate click in the
        # Play Console, not a dropdown on a build. Promote from a testing track.
        description: 'Publish the .aab to a Play track (alpha = canonical tester release + update prompt)'
        required: false
        default: alpha
        type: choice
        options: [alpha, internal, beta, none]
      stream_pilot:
        description: 'Compile Stream-capable 1:1 audio (runtime flag selects Stream or Cloudflare)'
        required: false
        default: true
        type: boolean

env:
  # [BUILD-WIDGET-1] The environment is now an explicit dispatch INPUT, not an
  # inference from the branch. The `|| (...)` keeps the old branch-derived value
  # as a fallback for the (currently disabled) push trigger, where inputs are ''.
  AVATOK_ENV: ${{ inputs.environment || (github.ref_name == 'staging' && 'staging' || 'prod') }}
  # A Play upload consumes only the AAB; `both` also creates the side-load APK.
  BUILD_APK: ${{ (inputs.artifact == 'aab') && 'false' || 'true' }}
  BUILD_AAB: ${{ (inputs.artifact == 'aab' || inputs.artifact == 'both') && 'true' || 'false' }}
  # [AVA-UPDATE-AUTO] '' / 'none' => no Play upload. Empty inputs (push trigger)
  # therefore publish nothing, exactly as before.
  PLAY_TRACK: ${{ inputs.play_track || 'none' }}
  # [STREAM-CALL-PILOT-4] Compile both providers into release builds. Runtime
  # config selects Stream or instantly rolls 1:1 calls back to Cloudflare;
  # `false` remains an emergency build-time escape hatch.
  STREAM_CALL_SDK: ${{ inputs.stream_pilot && '1' || '0' }}
  STREAM_CALL_PILOT_COMPILED: ${{ inputs.stream_pilot && 'true' || 'false' }}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    # [PROD-GATE-1] HARD approval gate. CLAUDE.md has said "NEVER trigger a build"
    # since before 2026-07-09, and on 2026-07-09 an agent ran `gh workflow run
    # android.yml` on `main` anyway (run 28988548192, event=workflow_dispatch) and
    # shipped a PRODUCTION build unasked. Written rules do not bind an AI.
    #
    # A `prod` build now targets the `production` GitHub Environment, which has the
    # owner as a REQUIRED REVIEWER. The run pauses at "Waiting for approval" and does
    # nothing until he clicks Approve in the Actions tab (and gets an email). No
    # token, agent, or API call can bypass an environment protection rule.
    #
    # `staging` has no reviewers — staging builds still run instantly, unattended.
    environment: ${{ (inputs.environment || (github.ref_name == 'staging' && 'staging' || 'prod')) == 'prod' && 'production' || 'staging' }}
    env:
      # [AAB-AUTO-1] Hoisted to JOB level so `if:` conditions can test it. Secrets
      # cannot be referenced directly in `if:`; an env var derived from one can.
      HAS_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      # [AVA-UPDATE-AUTO] Same trick as HAS_UPLOAD_KEYSTORE — secrets can't be read
      # in an `if:`, but an env var derived from one can.
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [BUILD-WIDGET-1] Environment/branch guard. Picking "staging" in the widget
      # only sets --dart-define=AVATOK_ENV=staging; it does NOT change which code is
      # checked out. Dispatching "staging" from `main` would ship PROD code pointed
      # at the staging backend (and vice-versa: a "prod" build off `staging` would
      # ship untested code to live users). Fail loudly instead.
      #   prod    must be built from main
      #   staging must be built from staging
      - name: Guard — environment must match the branch
        run: |
          ENV="${AVATOK_ENV}"
          REF="${GITHUB_REF_NAME}"
          echo "environment=$ENV  branch=$REF  artifact=${{ inputs.artifact || 'aab' }}  play_track=${PLAY_TRACK}"
          if [ "$ENV" = "prod" ] && [ "$REF" != "main" ]; then
            echo "::error::PROD build requested from branch '$REF'. Production is built from 'main' only."
            exit 1
          fi
          if [ "$ENV" = "staging" ] && [ "$REF" != "staging" ]; then
            echo "::error::STAGING build requested from branch '$REF'. Re-run this workflow with the 'staging' branch selected."
            exit 1
          fi
          # Stream is an explicit build variant in both environments. Runtime
          # routing remains protected by the server flag/percentage, so the
          # same production APK can be returned to Cloudflare immediately.
          # [AVA-UPDATE-AUTO] Validate the Play combination HERE, not 15 minutes
          # later next to the upload. The old late-only guard meant a bad pairing
          # burned a full Gradle build before saying so.
          if [ "$PLAY_TRACK" != "none" ]; then
            if [ "$ENV" != "prod" ]; then
              echo "::error::play_track=$PLAY_TRACK needs environment=prod. Staging and prod share the applicationId ai.avatok.avatok_call, so publishing a staging build would ride the SAME Play listing every real user auto-updates from and silently repoint them at the staging backend. Re-run with environment=prod (from main), or set play_track=none for a staging artifact."
              exit 1
            fi
            if [ "$BUILD_AAB" != "true" ]; then
              echo "::error::play_track=$PLAY_TRACK needs an .aab — Play does not accept the side-load APK. Re-run with artifact=aab or artifact=both."
              exit 1
            fi
          fi
          echo "OK: $ENV build from '$REF'."

      # [AAB-AUTO-1] An .aab MUST be signed with the Play upload key. Without the
      # keystore env vars, postcreate.py's injected signingConfig silently falls
      # back to the DEBUG key (app/tool/postcreate.py:482) — the build "succeeds"
      # and produces a bundle Play rejects at upload with "not signed with the
      # upload certificate." Fail here instead, with the fix in the error message.
      - name: Guard — AAB requires the Play upload keystore
        if: env.BUILD_AAB == 'true' && env.HAS_UPLOAD_KEYSTORE != 'true'
        run: |
          echo "::error::AAB requested but ANDROID_UPLOAD_KEYSTORE_BASE64 is not set on this repo."
          echo "Without it the .aab is signed with the DEBUG key and Play will reject it."
          echo ""
          echo "Fix (run once, from the repo root):"
          echo "  gh secret set ANDROID_UPLOAD_KEYSTORE_BASE64 < secrets/avatok-upload.jks.base64"
          echo "  gh secret set ANDROID_UPLOAD_STORE_PASSWORD"
          echo "  gh secret set ANDROID_UPLOAD_KEY_ALIAS"
          echo "  gh secret set ANDROID_UPLOAD_KEY_PASSWORD"
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the last stable BEFORE Flutter 3.44. 3.44 marked IconData
          # `final` (breaking-changes/icondata-class-marked-final), which breaks
          # phosphor_flutter 2.1.0 (it does `class PhosphorIconData extends
          # IconData`). 3.41.x ships Dart 3.9 (>= the repo's 3.7 floor) and keeps
          # the existing PhosphorIcons.name(PhosphorIconsStyle.x) API working.
          flutter-version: 3.41.x
          channel: stable
          cache: true

      - name: Generate android/ platform files
        working-directory: app
        run: flutter create --platforms=android --org ai.avatok --project-name avatok_call .

      - name: Configure Android (permissions, minSdk)
        working-directory: app
        run: python3 tool/postcreate.py

      # flutter create regenerates build.gradle before postcreate.py patches it.
      # Fail closed here so Play can never receive another Android 15 bundle if
      # that patch regresses or Flutter changes its generated Gradle syntax.
      - name: Guard — Play bundle must target Android 16
        working-directory: app
        run: |
          if ! grep -Eq 'targetSdk([[:space:]]*=[[:space:]]*|Version[[:space:]]+)36' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null; then
            echo "::error::Generated Android project does not target API 36. Refusing to build or publish."
            grep -nE 'compileSdk|targetSdk' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
            exit 1
          fi
          echo "Verified generated Android project targets API 36."

      # CI runner hardening: the GitHub-hosted runner (4 vCPU / 16 GB) was being
      # killed (SIGTERM / exit 143) mid-`assembleRelease` because the default
      # Gradle + Kotlin JVMs over-commit memory on this heavy app (WebRTC/LiveKit
      # native libs). Cap the heaps, kill the daemon + parallelism + VFS watch so
      # peak memory stays well under the runner limit. Last key wins in a
      # .properties file, so these override Flutter's generated defaults.
      - name: Harden Gradle for the CI runner (memory)
        working-directory: app
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          kotlin.daemon.jvmargs=-Xmx2g
          # R8 compat (non-full) mode: tolerate optional missing classes from
          # build-time-only deps (Stripe push-provisioning, AutoValue/javapoet,
          # javax.lang.model). Full mode treats them as hard errors; for a
          # side-load test APK we demote to warnings (paired with -dontwarn rules).
          android.enableR8.fullMode=false
          EOF
          echo "----- effective gradle.properties tail -----"
          tail -8 android/gradle.properties

      - name: Pub get
        working-directory: app
        run: flutter pub get

      # Stream's M125 WebRTC fork intentionally has no decoded-playback callback.
      # The Stream pilot still needs flutter_webrtc for the dark Cloudflare
      # rollback path, so adapt that plugin and fail-close only AvaTOK's optional
      # recording/translation taps inside this ephemeral CI checkout.
      - name: Prepare WebRTC sources for Stream pilot
        if: env.STREAM_CALL_SDK == '1'
        run: python3 scripts/patch_stream_pilot_webrtc.py app

      # flutter_callkit_incoming 2.5.8 emits Decline only to a live Dart event
      # sink. With the app swiped away that sink does not exist, so the action is
      # silently lost. This fail-closed source patch adds a native bridge hook;
      # it refuses unknown plugin source/version instead of shipping unprotected.
      - name: Lock killed-app call decline bridge
        run: python3 scripts/patch_callkit_native_decline.py app

      - name: Generate code (drift / build_runner)
        working-directory: app
        # --delete-conflicting-outputs so a committed *.g.dart (e.g. db.g.dart) is
        # regenerated from source on a clean checkout instead of failing as a
        # "conflicting output" (matches the macOS workflow).
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (non-blocking)
        working-directory: app
        run: flutter analyze || true

      # Cloudflare-native pivot: the Nostr-era tests (nip44, relay diags) are
      # retired with the crypto/relay code. Run whatever tests remain; the
      # release .aab build below stays the real compile gate.
      - name: Test (compile gate)
        working-directory: app
        run: |
          if ls test/*_test.dart >/dev/null 2>&1; then flutter test; else echo "no tests — .aab build is the compile gate"; fi

      # Give every CI build a strictly-increasing versionCode derived from the
      # run number. The pubspec versionCode is pinned, so without this Play would
      # reject each upload as a duplicate; $((10000 + run_number)) guarantees each
      # new .aab is strictly newer. Signature stability is handled by
      # postcreate.py: it pins the committed keystore for the debug signingConfig
      # and points the release buildType at the upload keystore when the secret
      # env vars are set (falling back to the committed keystore otherwise).

      # Decode the Play upload keystore when the secret is configured. When it's
      # absent (e.g. before the secret is added) the release signingConfig in
      # postcreate.py falls back to the committed keystore, so the .aab still
      # builds — re-key with your real upload keystore before going live.
      # [AAB-AUTO-1] Was `if: env.ANDROID_UPLOAD_KEYSTORE_BASE64 != ''`, testing a var
      # defined only in THIS step's own `env:` block — whether that is in scope for
      # the step's own `if` is ambiguous in Actions. Use the job-level flag instead.
      - name: Decode upload keystore
        if: env.HAS_UPLOAD_KEYSTORE == 'true'
        id: keystore
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/avatok-upload.jks"
          echo "path=$RUNNER_TEMP/avatok-upload.jks" >> $GITHUB_OUTPUT
          ls -la "$RUNNER_TEMP/avatok-upload.jks"
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}

      # [AAB-AUTO-1] Belt-and-braces: the decode step above is conditional, so if it
      # ever no-ops the keystore path is empty and Gradle would fall back to the
      # debug key. Assert the file really exists before we build a bundle.
      - name: Verify upload keystore decoded (AAB only)
        if: env.BUILD_AAB == 'true'
        run: |
          if [ ! -s "${{ steps.keystore.outputs.path }}" ]; then
            echo "::error::Upload keystore did not decode — refusing to build a debug-signed .aab."
            exit 1
          fi
          echo "Upload keystore present: ${{ steps.keystore.outputs.path }}"

      # [SHIP-BOTH-1] Build and publish the side-load APK FIRST. Closed Alpha can
      # spend hours or days in Play review; the owner needs this direct APK link
      # as soon as compilation finishes so testing is not blocked by that review.
      # ⚠️ [UPDATE-ABI-OFFSET-1 2026-08-21] `--split-per-abi` IS DELIBERATELY GONE.
      # DO NOT PUT IT BACK. It silently broke the update check for anyone who
      # side-loaded this APK, permanently.
      #
      # Flutter's Gradle plugin adds `1000 * abiCode` to versionCode for split
      # APKs (armeabi-v7a=1, arm64-v8a=2, x86_64=3...). So this step stamped
      # arm64 APKs with `2000 + 10000 + run_number`, while the .aab below and
      # the `latestAppBuild` KV pointer both used `10000 + run_number`. The APK
      # and the pointer were on two different numbering schemes, 2000 apart.
      #
      # What that did to the owner (diagnosed from PostHog 2026-08-21): he
      # side-loaded the run-#601 APK, which installed as build 12601. From then
      # on `UpdateService` compared `latestAppBuild` (10603) against his
      # installed 12601, concluded 10603 <= 12601, and told him "You're on the
      # latest version (build 12601)" on every single check — forever, for every
      # future release. The side-load we recommended as a workaround was itself
      # what disabled his updates.
      #
      # `--target-platform android-arm64` ALREADY restricts this to a single
      # ABI, so `--split-per-abi` bought nothing here — it only added the
      # offset. Without it the output is `app-release.apk` (see the staging
      # step) and versionCode is exactly `--build-number`, matching the .aab
      # and the pointer.
      - name: Build release APK (arm64 only, side-load)
        if: env.BUILD_APK == 'true'
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --build-number=$((10000 + GITHUB_RUN_NUMBER)) --dart-define=AVATOK_ENV=$AVATOK_ENV --dart-define=GIT_SHA=${{ github.sha }} --dart-define=STREAM_CALL_PILOT_COMPILED=$STREAM_CALL_PILOT_COMPILED
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Stage .apk with a per-build unique name
        if: env.BUILD_APK == 'true'
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p dist
          ls -la app/build/app/outputs/flutter-apk/
          BUILD_NO=$((10000 + GITHUB_RUN_NUMBER))
          APK_NAME="avatok-call-arm64-b${BUILD_NO}.apk"
          # [UPDATE-ABI-OFFSET-1] Source file is `app-release.apk`, not
          # `app-arm64-v8a-release.apk` — dropping `--split-per-abi` above (see
          # why, at length, on that step) changes the output filename. The old
          # per-ABI name is kept as a fallback so a re-added flag does not
          # silently produce an empty release asset; if the fallback ever fires,
          # the versionCode is offset again and the update check is broken.
          if [ -f app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp app/build/app/outputs/flutter-apk/app-release.apk "dist/${APK_NAME}"
          elif [ -f app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            echo "::error::Found a per-ABI APK — --split-per-abi is back. That offsets versionCode by +2000 and permanently breaks the in-app update check for every side-loader. See [UPDATE-ABI-OFFSET-1]."
            exit 1
          else
            echo "::error::No release APK found in app/build/app/outputs/flutter-apk/"
            exit 1
          fi
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "staged: ${APK_NAME}"; ls -lh dist/

          # [UPDATE-ABI-OFFSET-1] ASSERT THE VERSION CODE. The whole bug was
          # that nobody ever checked the number actually baked into the APK
          # against the number written to `latestAppBuild`. A green build was
          # not evidence they matched, and for months they did not.
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT2" ]; then
            VC=$("$AAPT2" dump badging "dist/${APK_NAME}" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            echo "APK versionCode=$VC expected=$BUILD_NO"
            if [ "$VC" != "$BUILD_NO" ]; then
              echo "::error::APK versionCode $VC != latestAppBuild pointer $BUILD_NO. A side-loader on this APK would be told 'you are on the latest version' forever. See [UPDATE-ABI-OFFSET-1]."
              exit 1
            fi
          else
            # Skip LOUDLY. A missing tool must never look like a pass.
            echo "::warning::aapt2 not found — could NOT verify the APK versionCode matches $BUILD_NO."
          fi

      - name: Upload .apk artifact (side-load)
        if: env.BUILD_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: avatok-call-apk
          path: dist/${{ env.APK_NAME }}

      - name: Publish APK to Release (link available before Play review)
        if: env.BUILD_APK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AVATOK_ENV == 'staging' && 'staging-latest' || 'calltest-latest' }}
          name: ${{ env.AVATOK_ENV == 'staging' && 'AvaTok STAGING (latest)' || 'AvaTok Call Test (latest)' }}
          files: dist/${{ env.APK_NAME }}
          fail_on_unmatched_files: true
          body: |
            Built by CI from `app/` — environment: **${{ env.AVATOK_ENV }}**,
            format: **${{ inputs.artifact || 'aab' }}**.

            The versioned arm64 APK is ready for immediate side-loading. In a
            Ship it run, the matching AAB continues to Google Play Closed Alpha.

      # Android App Bundle (.aab) — for the Play Store. Play splits per-ABI/density
      # server-side. Built only when the owner picks `aab` or `both`.
      - name: Build release App Bundle (.aab) for Play Store
        if: env.BUILD_AAB == 'true'
        working-directory: app
        run: flutter build appbundle --release --build-number=$((10000 + GITHUB_RUN_NUMBER)) --dart-define=AVATOK_ENV=$AVATOK_ENV --dart-define=GIT_SHA=${{ github.sha }} --dart-define=STREAM_CALL_PILOT_COMPILED=$STREAM_CALL_PILOT_COMPILED
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Stage .aab with a stable name
        if: env.BUILD_AAB == 'true'
        run: |
          mkdir -p dist
          ls -la app/build/app/outputs/bundle/release/
          cp app/build/app/outputs/bundle/release/app-release.aab dist/avatok-call.aab
          echo "size:"; ls -lh dist/

      - name: Upload .aab artifact (Play Store)
        if: env.BUILD_AAB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: avatok-call-aab
          path: dist/avatok-call.aab

      # ── Play Store publishing [AVA-UPDATE-AUTO] ──────────────────────────────
      # Guard FIRST, upload second. Every failure below is one that would be
      # discovered by a tester, not by CI, so it fails loud and early instead.
      - name: Guard the Play upload
        if: env.PLAY_TRACK != 'none'
        run: |
          # A staging build MUST NEVER reach Play. postcreate.py sets no
          # applicationIdSuffix, so staging and prod share ai.avatok.avatok_call —
          # uploading a staging build (which talks to api-staging.avatok.ai) would
          # push it down the SAME listing every real user auto-updates from, and
          # silently repoint the whole user base at the staging backend. This is the
          # single worst thing this workflow could do, so it is checked first.
          if [ "$AVATOK_ENV" != "prod" ]; then
            echo "::error::Refusing to publish a '$AVATOK_ENV' build to Play. Staging and prod share the applicationId, so this would overwrite the live listing. Build with environment=prod to publish."
            exit 1
          fi
          if [ "$BUILD_AAB" != "true" ]; then
            echo "::error::play_track=$PLAY_TRACK needs an .aab — Play does not accept the side-load APK. Re-run with artifact=aab or artifact=both."
            exit 1
          fi
          if [ "$HAS_PLAY_SA" != "true" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set. Create a Play Console service account, grant it 'Release to testing tracks', and paste the JSON key into the repo secret."
            exit 1
          fi
          echo "Publishing to Play track: $PLAY_TRACK"

      - name: Publish .aab to Play track
        if: env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Matches `flutter create --org ai.avatok --project-name avatok_call`
          # in the Prepare step above. If that ever changes, change this too.
          packageName: ai.avatok.avatok_call
          releaseFiles: dist/avatok-call.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
          # Play rejects a bundle whose versionCode it has already seen. CI's
          # $((10000 + run_number)) is strictly increasing, so this holds — but if
          # a re-run ever collides, bump the run number rather than editing this.
          #
          # A versionCode is burned APP-WIDE, not per track: once 10420 lands on
          # internal, no track will ever accept it again. So a build goes to ONE
          # track; putting the same code on closed testing later means a new run.
          changesNotSentForReview: false

      # ── Close the loop: tell the running app a newer build exists ────────────
      # [AVA-UPDATE-AUTO] Without this the release is on Play but every installed
      # app still believes it is current, because UpdateService's fallback popup
      # only fires when latestAppBuild > installedBuild. That KV value used to be
      # bumped by hand and therefore wasn't: it sat at 28 for months while builds
      # shipped at 10000+, so the "new version available" popup NEVER fired for
      # anyone. Doing it here makes the release and the update signal atomic.
      #
      # CLOSED ALPHA ONLY. This is the owner's canonical tester release track as
      # of 2026-08-19, so the app update pointer must follow Alpha rather than the
      # now-inactive Internal track. The Play upload above must succeed before
      # this production pointer and its matching notification are advanced.
      #
      # Reuses scripts/flags.sh rather than calling wrangler directly, so the CI
      # write gets the same protections as a human one: KV holds OVERRIDES ONLY
      # (it merges, never re-materializes the blob) and it refuses to write an
      # empty/invalid config over live flags.
      - name: Point the update check at this build (Closed Alpha only)
        if: env.PLAY_TRACK == 'alpha'
        env:
          # Prod is fail-closed behind ALLOW_PROD=1 to stop a human writing live
          # flags by accident. Setting it here is deliberate, not a bypass: a prod
          # run already passed the `production` Environment's required-reviewer
          # gate, so the owner has explicitly approved this exact release.
          ALLOW_PROD: '1'
          AVATOK_TARGET: ${{ env.AVATOK_ENV }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_NO=$((10000 + GITHUB_RUN_NUMBER))
          echo "Pointing $AVATOK_ENV latestAppBuild at $BUILD_NO"
          # cf.sh runs `npx wrangler`. Without worker/node_modules present, npx
          # would silently fetch whatever wrangler is newest instead of the
          # ^4.0.0 this repo pins — so install first and keep CI deterministic.
          # Only runs on publishing builds, so it costs nothing on a normal one.
          ( cd worker && npm ci --no-audit --no-fund --silent )
          # [SHIP-UPDATE-FCM-1] An intentional production ship always enables the
          # update notice. This is a quiet, user-tapped notice—not a silent APK
          # install—and is now part of the owner's canonical SHIP IT contract.
          scripts/flags.sh set "latestAppBuild=$BUILD_NO" "inAppUpdateEnabled=true"
          # Prove it landed. /api/config is edge-cached for 60s, so a plain curl
          # here would happily echo the OLD value and turn this check into a lie.
          if [ "$AVATOK_ENV" = "prod" ]; then API=https://api.avatok.ai; else API=https://api-staging.avatok.ai; fi
          sleep 5
          GOT=$(curl -s -H 'Cache-Control: no-cache' "$API/api/config?cb=$RANDOM$$" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("latestAppBuild"))')
          echo "live latestAppBuild = $GOT (expected $BUILD_NO)"
          [ "$GOT" = "$BUILD_NO" ] || echo "::warning::latestAppBuild reads $GOT, expected $BUILD_NO — likely the 60s edge cache or colo propagation. Re-check with: curl -H 'Cache-Control: no-cache' \"$API/api/config?cb=\$RANDOM\""

      # [SHIP-UPDATE-FCM-1] The consumer used to notice latestAppBuild on its
      # minute cron, but the workflow never checked whether that happened. A Play
      # publish could therefore be green while every tester missed the update
      # push. The consumer now writes two durable KV markers: STARTED after the
      # broadcast is queued, COMPLETED after both modern + legacy token tables
      # have been paged. Do not report a successful SHIP IT without both.
      - name: Send and verify the update FCM notification (Closed Alpha only)
        if: env.PLAY_TRACK == 'alpha'
        env:
          ALLOW_PROD: '1'
          AVATOK_TARGET: ${{ env.AVATOK_ENV }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_NO=$((10000 + GITHUB_RUN_NUMBER))
          # The production fan-out consumer is scheduled every five minutes.
          # Allow one full schedule interval plus queue/KV propagation time;
          # the old 180s window falsely failed build 10576 even though both
          # markers reached the expected build moments after the timeout.
          DEADLINE=$((SECONDS + 420))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STARTED=$(scripts/cf.sh worker kv key get update_broadcast_last_build --binding TOKENS --remote 2>/dev/null || true)
            COMPLETED=$(scripts/cf.sh worker kv key get update_broadcast_completed_build --binding TOKENS --remote 2>/dev/null || true)
            echo "FCM update fan-out: started=${STARTED:-missing} completed=${COMPLETED:-missing} expected=$BUILD_NO"
            if [ "$STARTED" = "$BUILD_NO" ] && [ "$COMPLETED" = "$BUILD_NO" ]; then
              echo "Update FCM fan-out completed for build $BUILD_NO"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Build $BUILD_NO reached Play Closed Alpha, but its FCM update fan-out did not complete within 420 seconds. Do not report this SHIP IT as successful."
          exit 1

      - name: Publish AAB to Release (stable link)
        if: env.BUILD_AAB == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AVATOK_ENV == 'staging' && 'staging-latest' || 'calltest-latest' }}
          name: ${{ env.AVATOK_ENV == 'staging' && 'AvaTok STAGING (latest)' || 'AvaTok Call Test (latest)' }}
          files: dist/avatok-call.aab
          fail_on_unmatched_files: true
          body: |
            Built by CI from `app/` — environment: **${{ env.AVATOK_ENV }}**,
            format: **${{ inputs.artifact || 'aab' }}**.

            `avatok-call.aab` is the signed Google Play App Bundle submitted to
            Closed Alpha. Ship it also publishes a versioned arm64 APK earlier in
            the run so testing can begin without waiting for Play review.

      # Automatic build tracking: drop a PostHog annotation (commit SHA + message)
      # on the project timeline for every APK/AAB build, matching the `release`
      # property the app now sends (--dart-define=GIT_SHA). Best-effort — skips if
      # POSTHOG_PERSONAL_API_KEY isn't set and never fails the build.
      - name: PostHog build annotation
        if: success()
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_HOST: https://eu.posthog.com
          POSTHOG_PROJECT_ID: '139917'
          GIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$POSTHOG_KEY" ]; then echo "POSTHOG_PERSONAL_API_KEY unset — skipping annotation"; exit 0; fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SUBJECT=$(printf '%s' "${COMMIT_MSG:-manual build}" | head -n1)
          curl -sS -X POST "$POSTHOG_HOST/api/projects/$POSTHOG_PROJECT_ID/annotations/" \
            -H "Authorization: Bearer $POSTHOG_KEY" -H "Content-Type: application/json" \
            --data "$(jq -n --arg c "Android $AVATOK_ENV build ${GIT_SHA:0:7} — $SUBJECT" --arg d "$NOW" '{content:$c,date_marker:$d,scope:"project"}')" \
            -o /dev/null -w "PostHog annotation HTTP %{http_code}\n" || echo "annotation post failed (non-fatal)"
